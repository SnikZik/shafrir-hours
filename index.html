<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#14342f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="שעות שפריר">
<title>שעות שפריר</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --bg:#14342f; --ink:#f4f1e8; --muted:#a9bfb7; --card:#1c443d;
  --start:#e9b44c; --start-ink:#2b2005;
  --break:#f4f1e8; --break-ink:#14342f;
  --end:#d9674e; --end-ink:#fff8f4;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans Hebrew",Arial,sans-serif;
  display:flex;flex-direction:column;
  padding:max(20px,env(safe-area-inset-top)) 16px max(20px,env(safe-area-inset-bottom));
  max-width:480px;margin-inline:auto;
  -webkit-user-select:none;user-select:none;
}
header{padding:8px 4px 20px}
#hello{margin:0;font-size:17px;color:var(--muted);font-weight:500}
#status{margin:6px 0 0;font-size:30px;font-weight:800;line-height:1.15}
#clock{margin:18px 0 0;font-size:64px;font-weight:300;line-height:1;font-variant-numeric:tabular-nums;direction:ltr;text-align:right}
#detail{margin:10px 0 0;font-size:16px;color:var(--muted);min-height:1.4em}
main{flex:1;display:flex;flex-direction:column;gap:12px;min-height:0}
button{
  flex:1;min-height:84px;width:100%;border:0;border-radius:20px;
  font:inherit;font-size:25px;font-weight:800;cursor:pointer;
  transition:transform .08s ease,opacity .2s ease;
}
button:active:not(:disabled){transform:scale(.98)}
button:disabled{opacity:.22;cursor:default}
button:focus-visible{outline:3px solid #fff;outline-offset:3px}
#start{background:var(--start);color:var(--start-ink)}
#pause{background:var(--break);color:var(--break-ink)}
#end{background:var(--end);color:var(--end-ink)}
body.busy main button{opacity:.22}
#toast{
  margin:14px 0 0;min-height:44px;padding:11px 14px;border-radius:14px;
  font-size:16px;text-align:center;background:transparent;color:transparent;
}
#toast.show{background:var(--card);color:var(--ink)}
#toast.err{background:#5c2318;color:#ffe6df}
#report{
  position:fixed;inset:0;display:flex;align-items:flex-end;justify-content:center;
  padding:16px 16px max(16px,env(safe-area-inset-bottom));background:rgba(9,28,25,.82);z-index:10;
}
#report[hidden]{display:none}
#report-card{
  width:100%;max-width:440px;padding:24px 20px 20px;border-radius:24px;
  background:var(--ink);color:var(--bg);display:flex;flex-direction:column;gap:10px;
}
#report-title{margin:0;font-size:24px;font-weight:800}
#report-hint{font-size:16px;color:#4b625b}
#report-text{
  width:100%;min-height:110px;padding:12px 14px;border:2px solid #c9d3cf;border-radius:14px;
  font:inherit;font-size:18px;line-height:1.4;color:var(--bg);background:#fff;resize:vertical;
  -webkit-user-select:text;user-select:text;
}
#report-text:focus{outline:none;border-color:var(--bg)}
#report-card button{flex:none;min-height:56px;font-size:20px}
#report-mic{background:#e3e9e6;color:var(--bg)}
#report-mic.on{background:var(--end);color:var(--end-ink)}
#report-mic-status{margin:0;min-height:1.3em;font-size:15px;color:#4b625b}
#report-ok{background:var(--bg);color:var(--ink);min-height:64px}
#report-cancel{background:transparent;color:var(--bg);min-height:48px;font-size:18px;font-weight:600}
#report-card button:focus-visible{outline-color:var(--start)}
</style>
</head>
<body>
<header>
  <p id="hello">שלום שניר</p>
  <p id="status" role="status" aria-live="polite">טוען</p>
  <p id="clock" aria-hidden="true">0:00:00</p>
  <p id="detail"></p>
</header>
<main>
  <button id="start" disabled>התחלתי לעבוד</button>
  <button id="pause" disabled>יצאתי להפסקה</button>
  <button id="end" disabled>סיימתי לעבוד</button>
</main>
<p id="toast"></p>
<div id="report" role="dialog" aria-modal="true" aria-labelledby="report-title" hidden>
  <div id="report-card">
    <p id="report-title"></p>
    <label id="report-hint" for="report-text">מה עשית? כמה מילים, לא חובה</label>
    <textarea id="report-text" dir="rtl"></textarea>
    <button id="report-mic" type="button">הקלטה קולית</button>
    <p id="report-mic-status" aria-live="polite"></p>
    <button id="report-ok" type="button"></button>
    <button id="report-cancel" type="button">ביטול</button>
  </div>
</div>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
