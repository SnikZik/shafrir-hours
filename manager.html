<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#f6f3ec">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="משימות שניר">
<title>משימות שניר</title>
<link rel="manifest" href="manager.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f3ec; --paper:#fff; --ink:#14342f; --muted:#5f736d; --line:#e4e0d6; --soft:#eef2ef;
  --brand:#14342f; --accent:#e9b44c; --accent-ink:#2b2005;
  --red:#c4462f; --red-soft:#fbe6e0; --green:#2f8a5f; --green-soft:#e1f2e8; --amber:#b9770e; --amber-soft:#fbf0d9;
  --radius:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;background:var(--bg);color:var(--ink);font-family:Heebo,"Noto Sans Hebrew",Arial,sans-serif;font-size:16px;
  padding:max(18px,env(safe-area-inset-top)) 16px max(32px,env(safe-area-inset-bottom));
}
.wrap{max-width:1080px;margin:0 auto}
header{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;justify-content:space-between;margin-bottom:18px}
h1{margin:0;font-size:28px;font-weight:800}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;font-weight:700}
button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{min-height:46px;padding:0 18px;font-size:16px}
.btn-main{background:var(--brand);color:#fff}
.btn-accent{background:var(--accent);color:var(--accent-ink)}
.btn-soft{background:var(--soft);color:var(--ink)}
.btn-red{background:var(--red-soft);color:var(--red)}
.btn-green{background:var(--green);color:#fff}
.btn:disabled{opacity:.4;cursor:default}

.live{background:var(--brand);color:#fff;border-radius:var(--radius);padding:18px 20px;display:grid;grid-template-columns:1fr auto;gap:6px 20px;align-items:center;margin-bottom:18px}
.live-state{margin:0;font-size:21px;font-weight:800;display:flex;align-items:center;gap:10px}
.dot{width:12px;height:12px;border-radius:50%;background:#7f948e;flex:none}
.dot.on{background:#7fd1a8;box-shadow:0 0 0 0 rgba(127,209,168,.6);animation:pulse 2s infinite}
.dot.pause{background:var(--accent)}
@keyframes pulse{70%{box-shadow:0 0 0 10px rgba(127,209,168,0)}100%{box-shadow:0 0 0 0 rgba(127,209,168,0)}}
.live-sub{margin:0;color:#b9cbc5;font-size:15px;grid-column:1}
.live-nums{grid-column:2;grid-row:1 / span 2;display:flex;gap:22px;text-align:center}
.live-nums b{display:block;font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
.live-nums span{font-size:13px;color:#b9cbc5}

.layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start}
section{margin-bottom:22px}
h2{margin:0 0 10px;font-size:19px;font-weight:800;display:flex;align-items:center;gap:8px}
.count{background:var(--soft);color:var(--muted);border-radius:20px;padding:0 9px;font-size:14px;font-weight:700}
.waiting .count{background:var(--red);color:#fff}

.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:10px}
.card.active{border-color:var(--green);box-shadow:inset 3px 0 0 var(--green)}
.card-top{display:flex;align-items:flex-start;gap:10px}
.handle{cursor:grab;color:#b3ada0;font-size:20px;line-height:1.2;padding:2px 2px 0;touch-action:none;user-select:none}
.handle:active{cursor:grabbing}
.title{flex:1;margin:0;font-size:18px;font-weight:700;line-height:1.35;cursor:pointer}
.title:hover{text-decoration:underline}
.tag{font-size:13px;font-weight:700;border-radius:8px;padding:2px 9px;white-space:nowrap}
.tag-work{background:var(--soft);color:var(--ink)}
.tag-queue{background:#f1eee6;color:var(--muted)}
.tag-stuck{background:var(--red-soft);color:var(--red)}
.tag-review{background:var(--amber-soft);color:var(--amber)}
.tag-done{background:var(--green-soft);color:var(--green)}
.tag-live{background:var(--green-soft);color:var(--green)}
.progress{display:flex;align-items:center;gap:12px;margin:12px 0 8px}
.bar{flex:1;height:10px;background:#efece4;border-radius:6px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--brand);border-radius:6px;transition:width .4s}
.pct{font-size:18px;font-weight:800;min-width:48px;text-align:left;direction:ltr;font-variant-numeric:tabular-nums}
.meta{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:14px;color:var(--muted)}
.meta .bad{color:var(--red);font-weight:700}
.meta .over{color:var(--amber);font-weight:700}
.ask{background:var(--red-soft);border-radius:12px;padding:10px 12px;margin:10px 0 8px;font-size:15px}
.inline{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.inline textarea{flex:1 1 220px}
textarea,input{
  width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;font:inherit;font-size:16px;color:var(--ink);background:#fff;
}
textarea{min-height:46px;resize:vertical}
textarea:focus,input:focus{outline:none;border-color:var(--brand)}
.empty{color:var(--muted);background:var(--paper);border:1px dashed var(--line);border-radius:var(--radius);padding:16px;margin:0}
.sortable-ghost{opacity:.35}
.notes{margin-top:10px}
.link{background:none;border:0;padding:4px 0;color:var(--brand);font-weight:700;font-size:15px;text-decoration:underline;cursor:pointer}
.notes-list{margin-top:8px}
.notes-list li{font-size:15px;line-height:1.5}

aside .card{padding:14px}
.week-row{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:15px}
.week-row:last-child{border:0}
.week-row b{font-variant-numeric:tabular-nums;white-space:nowrap}
.week-total{font-weight:800}
.days{display:flex;gap:6px;align-items:flex-end;height:80px;margin-top:10px}
.days div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--muted);height:100%;justify-content:flex-end}
.days i{display:block;width:100%;background:var(--accent);border-radius:5px 5px 2px 2px;min-height:2px}
.feed li{font-size:14px;line-height:1.45}
.feed .when{color:var(--muted);font-size:12px}
ul.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
ul.list li{background:var(--soft);border-radius:12px;padding:9px 12px}
details summary{cursor:pointer;font-weight:800;font-size:17px;padding:4px 0 10px}

dialog{border:0;border-radius:20px;padding:0;width:min(640px,calc(100vw - 24px));max-height:calc(100vh - 32px);color:var(--ink);background:var(--paper)}
dialog::backdrop{background:rgba(20,52,47,.55)}
.dlg{padding:22px 22px 18px;display:flex;flex-direction:column;gap:12px}
.dlg h3{margin:0;font-size:22px;font-weight:800}
.dlg label{font-size:14px;font-weight:700;color:var(--muted);display:flex;flex-direction:column;gap:5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-start}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:var(--soft);border-radius:12px;padding:10px 6px;text-align:center}
.stat b{display:block;font-size:20px}
.stat span{font-size:12px;color:var(--muted)}
.desc{white-space:pre-wrap;line-height:1.55;margin:0}
.who{font-weight:800}
.when{color:var(--muted);font-size:13px}
.err{color:var(--red);font-size:14px;margin:0;min-height:1.2em}
#toast{position:fixed;bottom:max(18px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--brand);color:#fff;border-radius:12px;padding:10px 18px;font-size:15px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
#toast.show{opacity:1}
#toast.bad{background:var(--red)}

@media (max-width:820px){
  .layout{grid-template-columns:1fr}
  .live{grid-template-columns:1fr}
  .live-nums{grid-column:1;grid-row:auto;justify-content:flex-start;margin-top:8px}
  .stats{grid-template-columns:repeat(2,1fr)}
  .grid2{grid-template-columns:1fr}
  h1{font-size:24px}
}

</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>המשימות של שניר</h1>
    <button class="btn btn-accent" id="add" type="button">משימה חדשה</button>
  </header>

  <div class="live" aria-live="polite">
    <p class="live-state"><span class="dot" id="dot"></span><span id="live-text">טוען</span></p>
    <p class="live-sub" id="live-sub"></p>
    <div class="live-nums">
      <div><b id="n-today">0:00</b><span>היום</span></div>
      <div><b id="n-week">0:00</b><span>השבוע</span></div>
      <div><b id="n-open">0</b><span>פתוחות</span></div>
    </div>
  </div>

  <div class="layout">
    <main>
      <section class="waiting" id="waiting-sec" hidden>
        <h2>מחכה לך <span class="count" id="waiting-count"></span></h2>
        <div id="waiting"></div>
      </section>
      <section>
        <h2>משימות פתוחות <span class="count" id="open-count"></span></h2>
        <p class="when" style="margin:-4px 0 10px">גוררים כדי לקבוע סדר עדיפויות. שניר רואה את אותו סדר.</p>
        <div id="open"></div>
      </section>
      <section>
        <h2>הושלמו <span class="count" id="done-count"></span></h2>
        <div id="done"></div>
      </section>
    </main>
    <aside>
      <section>
        <h2>השבוע</h2>
        <div class="card"><div id="week"></div><div class="days" id="days"></div></div>
      </section>
      <section>
        <h2>עדכונים אחרונים</h2>
        <div class="card"><ul class="list feed" id="feed"></ul></div>
      </section>
      <p class="when"><a id="sheet-link" href="#" target="_blank" rel="noopener">קובץ האקסל המלא</a></p>
    </aside>
  </div>
</div>

<dialog id="form">
  <form class="dlg" method="dialog" id="form-el">
    <h3 id="form-title">משימה חדשה</h3>
    <label>מה המשימה<input id="f-title" maxlength="200" required autocomplete="off"></label>
    <label>פירוט, לא חובה<textarea id="f-desc" rows="4"></textarea></label>
    <div class="grid2">
      <label>הערכת שעות, לא חובה<input id="f-est" type="number" min="0" max="1000" step="0.5" inputmode="decimal"></label>
      <label>דדליין, לא חובה<input id="f-deadline" type="date"></label>
    </div>
    <p class="err" id="f-err"></p>
    <div class="actions">
      <button class="btn btn-main" id="f-save" type="submit" value="save">שמירה</button>
      <button class="btn btn-soft" type="button" id="f-cancel">ביטול</button>
    </div>
  </form>
</dialog>

<dialog id="detail">
  <div class="dlg" id="detail-body"></div>
</dialog>

<div id="toast" role="status"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
<script src="config.js?v=3"></script>
<script src="manager.js?v=4"></script>
</body>
</html>
